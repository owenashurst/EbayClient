name: Cut Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version part to bump'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  cut-release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Ensure on master branch
      run: git checkout -B master

    - name: Compute next version
      id: version
      run: |
        current=$(cat VERSION)
        IFS='.' read -r major minor patch <<< "$current"
        case "${{ github.event.inputs.bump }}" in
          major)
            major=$((major + 1)); minor=0; patch=0 ;;
          minor)
            minor=$((minor + 1)); patch=0 ;;
          *)
            patch=$((patch + 1)) ;;
        esac
        next="$major.$minor.$patch"
        echo "next=$next" >> "$GITHUB_OUTPUT"
        echo "$next" > VERSION

    - name: Commit version bump
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add VERSION
        git commit -m "chore: bump version to ${{ steps.version.outputs.next }}"
        git push origin master

    - name: Create and push release branch
      run: |
        git checkout -b release/${{ steps.version.outputs.next }}
        git push origin release/${{ steps.version.outputs.next }}
